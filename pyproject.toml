[project]
name = "teacup-run"
version = "0.1.0"
description = "Build on agents, not from scratch — a portable package format and runtime for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only the provider you actually call needs installing.
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
dev = [
    "pytest>=8",
    "openai>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teacup_run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
