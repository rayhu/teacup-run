# An OpenGraft agent is an installable Python distribution.
#
# That is what makes the format's one rule enforceable: everything the agent
# reads at runtime — agent.yaml, prompts/, skills/ — lives inside note_taker/,
# so `pip install` carries it. evals/ sits outside the package and stays behind,
# which is the point: it is development scaffolding, not part of the artifact.

[project]
name = "note-taker"
version = "0.1.0"
description = "Turns raw meeting notes into owned, dated action items."
requires-python = ">=3.11"
dependencies = ["opengraft"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["note_taker"]
